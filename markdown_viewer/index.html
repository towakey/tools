<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Markdown Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: "Segoe UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color: #24292f; background: #f6f8fa; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #d0d7de; font-size: 13px; }
  header .title { font-weight: 600; }
  header .file { color: #57606a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { margin-left: auto; padding: 4px 10px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  header button:hover { background: #eaeef2; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 32px 64px; background: #fff; min-height: calc(100vh - 49px); box-sizing: border-box; }
  h1, h2, h3, h4, h5, h6 { margin: 24px 0 12px; font-weight: 600; line-height: 1.3; }
  h1 { font-size: 1.8em; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; }
  h2 { font-size: 1.4em; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; }
  h3 { font-size: 1.15em; }
  p { margin: 0 0 12px; line-height: 1.7; }
  a { color: #0969da; }
  img { max-width: 100%; }
  code { padding: .15em .4em; font-family: Consolas, "Courier New", monospace; font-size: 90%; background: #eff1f3; border-radius: 4px; }
  pre { padding: 12px 16px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  blockquote { margin: 0 0 12px; padding: 0 16px; color: #57606a; border-left: 4px solid #d0d7de; }
  ul, ol { margin: 0 0 12px; padding-left: 28px; }
  li { line-height: 1.7; }
  table { border-collapse: collapse; margin: 0 0 12px; }
  th, td { padding: 6px 12px; border: 1px solid #d0d7de; }
  th { background: #f6f8fa; }
  hr { border: 0; border-top: 1px solid #d8dee4; margin: 24px 0; }
  #msg { padding: 16px; margin-bottom: 16px; border: 1px solid #ffe2a8; background: #fff8e6; border-radius: 6px; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <span class="title">Markdown Viewer</span>
  <span class="file" id="fileName"></span>
  <button id="openBtn">MDファイルを開く</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</header>
<main id="view"></main>
<script>
"use strict";
// ===== 設定: 読み込む Markdown ファイル (このHTMLからの相対パス or URL) =====
var MD_FILE = "README.md";
// =====================================================================

// --- Markdown -> HTML (簡易パーサ、外部ライブラリ不使用) ---
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[^A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/(https?:\/\/[^\s<>"'()]+[^\s<>"'().,;:!?])/g, '<a href="$1">$1</a>');
  return s;
}

function render(src) {
  var lines = src.replace(/\r\n?/g, "\n").split("\n");
  var html = "", i = 0;

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isTableSep(l) { return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && /-/.test(l); }
  function splitRow(l) {
    return l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
  }

  while (i < lines.length) {
    var line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }

    // コードブロック ```
    if (/^\s*```/.test(line)) {
      var buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
      continue;
    }

    // 見出し
    var m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m) {
      html += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
      i++; continue;
    }

    // 水平線
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += "<hr>"; i++; continue; }

    // 引用
    if (/^\s*>/.test(line)) {
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      html += "<blockquote>" + render(q.join("\n")) + "</blockquote>";
      continue;
    }

    // テーブル
    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      var head = splitRow(line);
      var aligns = splitRow(lines[i + 1]).map(function (a) {
        if (/^:-+:$/.test(a)) return "center";
        if (/^-+:$/.test(a)) return "right";
        return "";
      });
      i += 2;
      var rows = [];
      while (i < lines.length && isTableLine(lines[i])) rows.push(splitRow(lines[i++]));
      var t = "<table><thead><tr>";
      head.forEach(function (c, j) { t += "<th" + (aligns[j] ? ' style="text-align:' + aligns[j] + '"' : "") + ">" + inline(c) + "</th>"; });
      t += "</tr></thead><tbody>";
      rows.forEach(function (r) {
        t += "<tr>";
        r.forEach(function (c, j) { t += "<td" + (aligns[j] ? ' style="text-align:' + aligns[j] + '"' : "") + ">" + inline(c) + "</td>"; });
        t += "</tr>";
      });
      html += t + "</tbody></table>";
      continue;
    }

    // リスト (-, *, +, 1. / ネストは2段まで)
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      var stack = []; // {indent, ordered}
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        var lm = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        var indent = lm[1].replace(/\t/g, "    ").length;
        var ordered = /\d/.test(lm[2][0]);
        var body = lm[3];
        while (stack.length && indent < stack[stack.length - 1].indent) {
          html += stack.pop().ordered ? "</ol>" : "</ul>";
        }
        if (!stack.length || indent > stack[stack.length - 1].indent) {
          html += ordered ? "<ol>" : "<ul>";
          stack.push({ indent: indent, ordered: ordered });
        } else if (ordered !== stack[stack.length - 1].ordered) {
          html += stack.pop().ordered ? "</ol>" : "</ul>";
          html += ordered ? "<ol>" : "<ul>";
          stack.push({ indent: indent, ordered: ordered });
        }
        body = body.replace(/^\[( |x|X)\]\s+/, function (_, c) {
          return (c === " " ? "\u2610 " : "\u2611 ");
        });
        html += "<li>" + inline(body) + "</li>";
        i++;
      }
      while (stack.length) html += stack.pop().ordered ? "</ol>" : "</ul>";
      continue;
    }

    // 段落 (空行までまとめる)
    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^\s*```/.test(lines[i]) && !/^(#{1,6})\s/.test(lines[i]) &&
           !/^\s*>/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) &&
           !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])) {
      para.push(lines[i++]);
    }
    html += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  return html;
}

// --- 読み込み ---
var view = document.getElementById("view");
var fileName = document.getElementById("fileName");

function decode(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder("shift-jis").decode(buf); }
}

function showMarkdown(text, name) {
  view.innerHTML = render(text);
  fileName.textContent = name || "";
  document.title = (name || "Markdown") + " - Markdown Viewer";
}

function showError(msg) {
  view.innerHTML = '<div id="msg">' + msg + "</div>";
}

function load(path) {
  fetch(path)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    })
    .then(function (b) { showMarkdown(decode(b), path); })
    .catch(function () {
      showError(
        "<b>" + esc(path) + "</b> を読み込めませんでした。<br>" +
        "・IIS 等の Web サーバー経由で開いている場合: HTML と同じ場所に md ファイルがあるか、MD_FILE のパスを確認してください。<br>" +
        "・file:// で直接開いている場合: ブラウザ制限で自動読み込みできません。右上の「MDファイルを開く」からファイルを選んでください。"
      );
    });
}

document.getElementById("openBtn").addEventListener("click", function () {
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { showMarkdown(decode(r.result), f.name); };
  r.readAsArrayBuffer(f);
});

load(MD_FILE);
</script>
</body>
</html>
